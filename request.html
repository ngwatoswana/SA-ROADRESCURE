<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Request Emergency Help | RoadRescue SA</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<header>

<nav class="navbar">

<div class="logo">

<i class="fa-solid fa-shield-heart"></i>

RoadRescue SA

</div>


<a href="index.html" class="emergency-btn">

Home

</a>


</nav>

</header>



<section class="request-section">


<div class="request-container">


<h1>

🚨 Request Emergency Assistance

</h1>


<p>

Tell us what happened and we will connect you with the right service.

</p>



<form id="emergencyForm">



<!-- PERSONAL INFORMATION -->

<div class="form-box">

<h2>
<i class="fa-solid fa-user"></i>
Personal Information
</h2>


<label>Full Name</label>

<input
type="text"
id="name"
required>



<label>Phone Number</label>

<input
type="tel"
id="phone"
required>


</div>




<!-- SERVICE SELECTION -->

<div class="form-box">


<h2>

<i class="fa-solid fa-truck-medical"></i>

Emergency Service

</h2>


<div class="service-options">


<label>

<input type="radio"
name="service"
value="Mechanic"
checked>

🔧 Mechanic

</label>


<label>

<input type="radio"
name="service"
value="Hospital">

🚑 Ambulance

</label>


<label>

<input type="radio"
name="service"
value="Police">

👮 Police

</label>


<label>

<input type="radio"
name="service"
value="Towing">

🚛 Towing

</label>


<label>

<input type="radio"
name="service"
value="Fire Rescue">

🔥 Fire Rescue

</label>


<label>

<input type="radio"
name="service"
value="Fuel Delivery">

⛽ Fuel Delivery

</label>


</div>


</div>





<!-- VEHICLE -->

<div class="form-box">


<h2>

<i class="fa-solid fa-car"></i>

Vehicle Information

</h2>


<input
id="make"
placeholder="Vehicle Make">


<input
id="model"
placeholder="Vehicle Model">


<input
id="registration"
placeholder="Registration Number">


<input
id="colour"
placeholder="Vehicle Colour">


</div>





<!-- EMERGENCY DETAILS -->


<div class="form-box">


<h2>

<i class="fa-solid fa-triangle-exclamation"></i>

Emergency Details

</h2>


<label>Priority</label>


<select id="priority">


<option>Low</option>

<option>Medium</option>

<option>High</option>

<option>Critical</option>


</select>



<textarea

id="problem"

placeholder="Describe your emergency..."

rows="5"

required></textarea>


</div>






<!-- LOCATION -->


<div class="form-box">


<h2>

<i class="fa-solid fa-location-dot"></i>

Location

</h2>


<button

type="button"

onclick="getLocation()"

class="location-btn">

📍 Share My Location (GPS)

</button>


<p id="locationStatus" class="location-status">

Location not captured

</p>

<label for="locationAddress" style="margin-top: 10px; display: block;">Address / Landmark</label>

<input type="text" id="locationAddress" placeholder="Enter physical location or landmark (optional)...">


</div>





<!-- PHOTO -->


<div class="form-box">


<h2>

<i class="fa-solid fa-camera"></i>

Accident Photo

</h2>


<input

type="file"

id="photo"

accept="image/*">


<img

id="preview"

class="photo-preview">


</div>




<button

type="submit"

class="submit-btn">

🚨 Submit Emergency Request

</button>



</form>


</div>


</section>



<script src="request.js"></script>


</body>

</html>
